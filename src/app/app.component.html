@if (isAuthenticated()) {
  <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top">
    <div class="container-fluid">
      <a class="navbar-brand" routerLink="/dashboard">
        <i class="bi bi-shield-check me-2"></i>RBAC System
      </a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNav"
        aria-controls="navbarNav"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a
              class="nav-link"
              routerLink="/dashboard"
              routerLinkActive="active"
              *appHasPermission="'dashboard'"
            >
              <i class="bi bi-speedometer2 me-1"></i>Dashboard
            </a>
          </li>
          <li class="nav-item">
            <a
              class="nav-link"
              routerLink="/users"
              routerLinkActive="active"
              *appHasPermission="'users'"
            >
              <i class="bi bi-people me-1"></i>Users
            </a>
          </li>
          <li class="nav-item">
            <a
              class="nav-link"
              routerLink="/roles"
              routerLinkActive="active"
              *appHasPermission="'roles'"
            >
              <i class="bi bi-shield-check me-1"></i>Roles
            </a>
          </li>
        </ul>
        <div class="d-flex align-items-center">
          <div class="dropdown">
            <button
              class="btn btn-link text-decoration-none dropdown-toggle d-flex align-items-center"
              type="button"
              id="userDropdown"
              data-bs-toggle="dropdown"
              aria-expanded="false"
            >
              <div class="avatar-sm me-2">
                @if (currentUser()) {
                  {{ currentUser()!.firstName.charAt(0) }}{{ currentUser()!.lastName.charAt(0) }}
                }
              </div>
              <div class="text-start d-none d-md-block">
                <div class="fw-semibold text-dark">
                  @if (currentUser()) {
                    {{ currentUser()!.firstName }} {{ currentUser()!.lastName }}
                  }
                </div>
                <small class="text-muted">
                  @if (currentUser()?.role) {
                    {{ currentUser()!.role.name }}
                  }
                </small>
              </div>
            </button>
            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
              <li>
                <div class="dropdown-header">
                  <div class="fw-semibold">
                    @if (currentUser()) {
                      {{ currentUser()!.firstName }} {{ currentUser()!.lastName }}
                    }
                  </div>
                  <small class="text-muted">
                    @if (currentUser()) {
                      {{ currentUser()!.email }}
                    }
                  </small>
                </div>
              </li>
              <li><hr class="dropdown-divider" /></li>
              <li>
                <button class="dropdown-item text-danger" (click)="logout()">
                  <i class="bi bi-box-arrow-right me-2"></i>Logout
                </button>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </nav>
}

<router-outlet></router-outlet>

<!-- Toast Notifications -->
<app-toast></app-toast>
