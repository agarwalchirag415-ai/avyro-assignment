<div class="login-container">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card login-card shadow-lg">
          <div class="card-body">
            <div class="text-center mb-4">
              <h2 class="fw-bold text-primary">RBAC System</h2>
              <p class="text-muted">Role-Based Access Control</p>
            </div>

            <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
              @if (errorMessage()) {
                <div class="alert alert-danger alert-dismissible fade show" role="alert">
                  <i class="bi bi-exclamation-triangle-fill me-2"></i>
                  {{ errorMessage() }}
                  <button type="button" class="btn-close" (click)="errorMessage.set('')"></button>
                </div>
              }

              <div class="mb-3">
                <label for="username" class="form-label fw-semibold">Username</label>
                <input
                  type="text"
                  class="form-control form-control-lg"
                  id="username"
                  name="username"
                  [(ngModel)]="credentials.username"
                  placeholder="Enter username"
                  required
                  [disabled]="isLoading()"
                  autocomplete="username"
                />
              </div>

              <div class="mb-4">
                <label for="password" class="form-label fw-semibold">Password</label>
                <input
                  type="password"
                  class="form-control form-control-lg"
                  id="password"
                  name="password"
                  [(ngModel)]="credentials.password"
                  placeholder="Enter password"
                  required
                  [disabled]="isLoading()"
                  autocomplete="current-password"
                />
              </div>

              <button
                type="submit"
                class="btn btn-primary btn-lg w-100"
                [disabled]="isLoading() || !loginForm.valid"
              >
                @if (isLoading()) {
                  <span class="spinner-border spinner-border-sm me-2"></span>
                  Logging in...
                } @else {
                  Login
                }
              </button>

              <div class="mt-4 p-3 bg-light rounded">
                <p class="mb-1 fw-semibold text-center">Demo Credentials</p>
                <p class="mb-0 text-center text-muted small">
                  Username: <strong>admin</strong> | Password: <strong>admin</strong>
                </p>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
